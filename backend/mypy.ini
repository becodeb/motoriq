# Configuración pragmática de mypy para POPS.
# El tipado estricto de SQLAlchemy 2 + Pydantic v2 está activo vía sus stubs nativos.
# Los hallazgos restantes al día de hoy son mayormente sombreado de variables entre
# ramas (mypy no re-tipa un nombre reutilizado); el runtime está cubierto por pytest.
[mypy]
python_version = 3.12
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True

[mypy-app.seed]
# El seed usa atributos transitorios (_archetype, _trade) sobre instancias ORM.
disable_error_code = attr-defined
