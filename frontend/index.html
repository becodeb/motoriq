<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="description" content="Motor IQ — Sales Intelligence for Automotive. Convertí conversaciones en ventas." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Motor IQ</title>
    <script>
      // Aplica el tema antes del primer paint para evitar flash.
      try {
        const stored = localStorage.getItem("pops-theme");
        const dark = stored === "dark" || (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
